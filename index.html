<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rasmin Ahmed</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    .container {
      margin-top: 80px;
    }

    .typing {
      font-size: 2.8rem;
      font-weight: 600;
      border-right: 3px solid black;
      display: inline-block;
      white-space: nowrap;
      overflow: hidden;
    }

    .profile {
      width: 260px;
      border-radius: 20px;
      margin-top: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .subtitle {
      margin-top: 15px;
      font-size: 1.2rem;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1 class="typing"></h1>

    <p class="subtitle">Welcome to my portfolio ✨</p>

    <!-- Make sure your image file name matches -->
    <img src="profile.jpg" alt="Rasmin Ahmed" class="profile">
  </div>

  <script>
    const text = "Hi, I'm Rasmin Ahmed";
    const element = document.querySelector(".typing");

    let i = 0;

    function typeWriter() {
      if (i < text.length) {
        element.innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 80);
      }
    }

    typeWriter();
  </script>

</body>
</html>
